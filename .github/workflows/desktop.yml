name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: dmg
          - os: windows-latest
            artifact: exe
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (Linux build deps for better-sqlite3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: npm ci
      - name: Disable Electron SUID sandbox helper on Linux CI
        if: runner.os == 'Linux'
        run: |
          # electron-builder probes `electron --version`; the chrome-sandbox
          # helper aborts on Ubuntu runners unless owned by root with mode 4755.
          SANDBOX="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$SANDBOX" ]; then
            sudo chown root:root "$SANDBOX"
            sudo chmod 4755 "$SANDBOX"
          fi
          echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run dist -w @bindarr/desktop-electron
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: bindarr-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/*.AppImage
            apps/desktop-electron/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (Linux build deps for better-sqlite3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - name: Sync package versions from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"
          export VER
          node -e "
            const fs=require('fs');
            const ver=process.env.VER;
            for (const p of ['package.json','apps/desktop-electron/package.json']) {
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              j.version=ver;
              fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
            }
            console.log('version', ver);
          "
      - run: npm ci
      - name: Disable Electron SUID sandbox helper on Linux CI
        if: runner.os == 'Linux'
        run: |
          SANDBOX="node_modules/electron/dist/chrome-sandbox"
          if [ -f "$SANDBOX" ]; then
            sudo chown root:root "$SANDBOX"
            sudo chmod 4755 "$SANDBOX"
          fi
          echo "ELECTRON_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
      # APP_VERSION is set without the leading "v" via GITHUB_ENV above.
      - run: npm run build
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm run dist:publish -w @bindarr/desktop-electron
