services:
  bindarr:
    build: .
    image: bindarr:latest
    container_name: bindarr
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_PATH: /data/bindarr.db
      POKEMONTCG_API_KEY: ${POKEMONTCG_API_KEY:-}
    volumes:
      - bindarr-data:/data
      # Bind-mount alternative (easier manual backups) — comment the line above
      # and uncomment this instead:
      # - ./data:/data
    restart: unless-stopped
    # Optional reverse-proxy example (Caddy): put Caddy/Traefik in front with
    # auth + TLS instead of publishing 8080 directly. Do not expose Bindarr
    # to the public internet without authentication — it has none built in.

volumes:
  bindarr-data:
