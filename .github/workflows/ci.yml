name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Docker build smoke test
        run: |
          docker build -t bindarr:ci .
          docker run -d --name bindarr-ci -p 8080:8080 bindarr:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/health && break || sleep 1; done
          curl -sf http://localhost:8080/api/state > /dev/null
          docker rm -f bindarr-ci
